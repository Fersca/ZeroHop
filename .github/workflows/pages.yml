name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/p2p-webrtc-chat-ype7jc, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # si el hash del CSP no corresponde al script, la página quedaría rota:
      # mejor no publicar
      - run: node tools/csp.mjs --check

      # enablement: true intenta prender Pages solo; el token de Actions no
      # siempre puede crear el sitio, así que no rompemos el build por eso.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::Pages no está activado todavía. Activalo en \
          Settings → Pages → Source: GitHub Actions y volvé a correr este workflow."

      # el sitio es el repo entero: index.html es autocontenido
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

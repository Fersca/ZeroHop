name: Tests

on:
  push:
    branches: [claude/p2p-webrtc-chat-ype7jc, main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      # las suites levantan su propio servidor estático y su propio Chromium
      - run: npm test
